<!doctype html>
<html lang="ru"><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@600;800;900&family=JetBrains+Mono:wght@500;700;800&family=Manrope:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--lime:#D4FF3F;--red:#FF3B4E;--amber:#FFB547}
*{margin:0;padding:0;box-sizing:border-box}
body{width:1080px;height:1920px;overflow:hidden;background:#000}
#stage{position:relative;width:1080px;height:1920px;overflow:hidden;background:#000}
.cam{position:absolute;inset:0;transform-origin:50% 52%}
.F{position:absolute;inset:0;overflow:hidden;color:#fff;font-family:Manrope;
 background:radial-gradient(90% 60% at 50% 48%,#121722 0%,#080A0F 55%,#030406 100%)}
svg.L{position:absolute;left:0;top:0}
.T{position:absolute;left:0;right:0;text-align:center;z-index:5}
.w{position:relative;display:inline-block;font-family:Unbounded;font-weight:900;text-transform:uppercase;letter-spacing:-.025em;line-height:.98;white-space:nowrap;
 text-shadow:-3px 0 rgba(255,40,90,.55),3px 0 rgba(60,230,255,.5),0 0 40px rgba(255,255,255,.18)}
.w .gh{position:absolute;left:0;top:0;white-space:nowrap;filter:blur(7px);opacity:.22;text-shadow:none}
.w .gh2{opacity:.09;filter:blur(14px)}
.blk{display:inline-block;background:var(--lime);color:#07080a;font-family:Unbounded;font-weight:900;text-transform:uppercase;letter-spacing:-.02em;white-space:nowrap;
 padding:.12em .32em .1em;border-radius:.16em;box-shadow:0 0 70px rgba(212,255,63,.55),.12em .12em 0 rgba(212,255,63,.28);text-shadow:none}
.br{position:relative;display:inline-block;color:var(--lime);padding:.02em .16em;text-shadow:0 0 28px rgba(212,255,63,.8)}
.br.red{color:var(--red);text-shadow:0 0 28px rgba(255,59,78,.8)}
.br i{position:absolute;width:22px;height:22px;border:5px solid currentColor}
.br b{position:absolute;width:14px;height:14px;background:#fff;border:3px solid currentColor;right:-14px;top:-14px}
.m{font-family:'JetBrains Mono';font-weight:700;text-transform:uppercase;letter-spacing:.08em}
.sm{font-family:Unbounded;font-weight:800;text-transform:uppercase;letter-spacing:.02em}
.hud{position:absolute;inset:0;z-index:30;font-family:'JetBrains Mono';font-weight:700;font-size:21px;letter-spacing:.06em;color:rgba(255,255,255,.62);text-transform:uppercase}
.hud .p{position:absolute;white-space:nowrap}
.dot{display:inline-block;width:12px;height:12px;border-radius:50%;background:var(--red);margin-right:10px;box-shadow:0 0 12px var(--red)}
.chip{position:absolute;z-index:6;font-family:'JetBrains Mono';font-weight:700;font-size:24px;letter-spacing:.06em;text-transform:uppercase;white-space:nowrap;
 padding:12px 18px;border:2px solid rgba(212,255,63,.75);background:rgba(8,10,12,.78);color:#fff}
.chip em{font-style:normal;color:var(--lime)}
.cap{position:absolute;left:80px;right:80px;top:1650px;z-index:7;text-align:center;font-family:'JetBrains Mono';font-weight:700;font-size:27px;line-height:1.45;color:rgba(255,255,255,.9);text-transform:uppercase;letter-spacing:.04em}
.cap span{background:rgba(5,6,8,.72);padding:4px 10px;box-decoration-break:clone;-webkit-box-decoration-break:clone}
.cur{display:inline-block;width:.6em;height:1em;background:var(--lime);vertical-align:-.12em;margin-left:4px}
.over{position:absolute;inset:0;pointer-events:none}
.sub{position:absolute;left:70px;right:70px;top:1628px;z-index:35;text-align:center;font-family:Manrope;font-weight:800;font-size:35px;line-height:1.38;color:#fff}
.sub>span{background:rgba(5,6,8,.8);padding:5px 14px;box-decoration-break:clone;-webkit-box-decoration-break:clone}
</style></head><body><div id="stage"></div>
<script src="timeline.js"></script>
<script>
// ===== утилиты =====
const clamp=(x,a=0,b=1)=>Math.max(a,Math.min(b,x));
const lerp=(a,b,t)=>a+(b-a)*t;
const P=(t,a,b)=>clamp((t-a)/(b-a));
const eo=x=>1-Math.pow(1-x,3);
const ex=x=>x>=1?1:1-Math.pow(2,-10*x);
const eb=x=>{const c1=1.9,c3=c1+1;return x<=0?0:1+c3*Math.pow(x-1,3)+c1*Math.pow(x-1,2)};
const eio=x=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2;
const fr=x=>x-Math.floor(x);
const H=k=>fr(Math.sin(k*12.9898+78.233)*43758.5453);
const pad=(n,l=2)=>String(Math.floor(n)).padStart(l,'0');

const SC=TL.scenes,TOT=TL.total;
const NAMES=['ПРИВЕТ','НЕТ СИЛ','КРОВОТОК','МИТОХОНДРИИ','СТРЕСС','МИТО-ПАСПОРТ','ЗАБОР КРОВИ','МИКРОСКОП','ОТЧЁТ','ПЛАН','LOVE MY BODY'];
const TOPS=['LOVE MY BODY · ВЫПУСК 01 · МИТО-ПАСПОРТ','СКАНИРОВАНИЕ · ОРГАНИЗМ · ЭНЕРГИЯ','ГЛУБИНА ▸ КРОВОТОК · СКОРОСТЬ 0.3 М/С','ОБЪЕКТИВ ×1000 · КЛЕТКА · ЭНЕРГООБМЕН','ВНИМАНИЕ · СВОБОДНЫЕ РАДИКАЛЫ · ВОСПАЛЕНИЕ','MITO-ID · ИММУНИТЕТ × ЭНЕРГИЯ','ЗАБОР ОБРАЗЦА · 1 ПРОБИРКА · 5 МИНУТ','ЛАБОРАТОРИЯ · МАЗОК КРОВИ · ×1000','РЕЗУЛЬТАТ · РАЗБОР С ВРАЧОМ','ПЕРСОНАЛЬНЫЙ ПОДХОД','КОНЕЦ ЗАПИСИ · LOVE MY BODY'];
const SHAKES=[[SC[5][0]+1.6,.9],[SC[6][0]+.1,.4],[SC[10][0]+.05,.6],[SC[4][0]+.2,.5],[SC[7][0]+.05,.3],[SC[8][0]+.5,.5],[SC[0][0]+0.6,.25]];

// ===== текстовые эффекты =====
function W(txt,size,p,extra=''){
 const e=ex(clamp(p)),x=(1-e)*520,tr=(1-e)*300,sk=(1-e)*-14,op=clamp(p*4);
 return `<span class="w" style="font-size:${size}px;opacity:${op};transform:translateX(${x}px) skewX(${sk}deg);${extra}"><span class="gh" style="transform:translateX(${-46+tr*.5}px)">${txt}</span><span class="gh gh2" style="transform:translateX(${-110+tr}px)">${txt}</span>${txt}</span>`}
function BLK(txt,size,p,red){const e=eb(clamp(p)),op=clamp(p*5);
 return `<span class="blk" style="font-size:${size}px;opacity:${op};transform:scale(${Math.max(0,e)}) rotate(${-2.2-(1-clamp(p))*14}deg);${red?'background:#FF3B4E;color:#fff;box-shadow:0 0 70px rgba(255,59,78,.6)':''}">${txt}</span>`}
function BR(txt,size,p,red){const e=eo(clamp(p)),o=(1-e)*60,op=clamp(p*3),c=clamp((p-.25)*2);
 const cs=[`left:${-6-o}px;top:${-6-o}px;border-right:0;border-bottom:0`,`right:${-6-o}px;top:${-6-o}px;border-left:0;border-bottom:0`,`left:${-6-o}px;bottom:${-6-o}px;border-right:0;border-top:0`,`right:${-6-o}px;bottom:${-6-o}px;border-left:0;border-top:0`];
 return `<span class="w" style="font-size:${size}px;opacity:${op}"><span class="br ${red?'red':''}" style="background:rgba(${red?'255,59,78':'212,255,63'},${.1*c})">${cs.map(s=>`<i style="${s}"></i>`).join('')}<b style="opacity:${c}"></b><span style="opacity:${c};filter:blur(${(1-c)*10}px)">${txt}</span></span></span>`}
function TY(txt,p){const n=Math.round(txt.length*clamp(p));return txt.slice(0,n)}
function CAP(txt,t,a=1.1,dur=1.6){if(t<a)return '';const p=P(t,a,a+dur),blink=(Math.floor(t*3)%2===0)||p<1;
 return `<div class="cap"><span>${TY(txt,p)}${blink?'<i class="cur"></i>':''}</span></div>`}
function CHIP(html,plain,t,a,style,red){if(t<a)return '';const p=P(t,a,a+.5),e=eo(p);
 return `<div class="chip" style="${style};clip-path:inset(0 ${(1-e)*100}% 0 0);${red?'border-color:#FF3B4E':''}">${html}</div>`}

// ===== графика =====
const DEFS=`<defs>
<radialGradient id="rbc" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#5e0614"/><stop offset=".5" stop-color="#a3122a"/><stop offset=".82" stop-color="#ff3d55"/><stop offset=".93" stop-color="#ff8090"/><stop offset="1" stop-color="#ff8090" stop-opacity="0"/></radialGradient>
<radialGradient id="cyto" cx="50%" cy="45%" r="55%"><stop offset="0" stop-color="#1d3b52" stop-opacity=".9"/><stop offset=".75" stop-color="#0f2233" stop-opacity=".85"/><stop offset="1" stop-color="#3fa7c9" stop-opacity=".55"/></radialGradient>
<radialGradient id="cytoR" cx="50%" cy="45%" r="55%"><stop offset="0" stop-color="#3a1424" stop-opacity=".9"/><stop offset=".75" stop-color="#22101a" stop-opacity=".85"/><stop offset="1" stop-color="#c93f5a" stop-opacity=".55"/></radialGradient>
<radialGradient id="nuc" cx="40%" cy="35%" r="70%"><stop offset="0" stop-color="#b58cff"/><stop offset=".6" stop-color="#5a2fb0"/><stop offset="1" stop-color="#2a1260"/></radialGradient>
<linearGradient id="mito" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFC27A"/><stop offset=".45" stop-color="#FF7A59"/><stop offset="1" stop-color="#E0365A"/></linearGradient>
<linearGradient id="mitoIn" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ff9a6b"/><stop offset="1" stop-color="#8f1d3e"/></linearGradient>
<linearGradient id="mitoG" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#7c8794"/><stop offset="1" stop-color="#3a3f4a"/></linearGradient>
<radialGradient id="spark"><stop offset="0" stop-color="#fff"/><stop offset=".25" stop-color="#FFE29A"/><stop offset="1" stop-color="#FFB547" stop-opacity="0"/></radialGradient>
<radialGradient id="rad"><stop offset="0" stop-color="#fff"/><stop offset=".25" stop-color="#ff3b4e"/><stop offset="1" stop-color="#ff3b4e" stop-opacity="0"/></radialGradient>
<radialGradient id="smear" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#f6e9f1"/><stop offset=".8" stop-color="#e3c8da"/><stop offset="1" stop-color="#b996b0"/></radialGradient>
<linearGradient id="scanG" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#D4FF3F" stop-opacity="0"/><stop offset=".85" stop-color="#D4FF3F" stop-opacity=".2"/><stop offset="1" stop-color="#D4FF3F" stop-opacity=".65"/></linearGradient>
<linearGradient id="blood" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#5e0614"/><stop offset=".5" stop-color="#c8193a"/><stop offset="1" stop-color="#5e0614"/></linearGradient>
<linearGradient id="glass" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fff" stop-opacity=".28"/><stop offset=".2" stop-color="#fff" stop-opacity=".05"/><stop offset=".8" stop-color="#fff" stop-opacity=".03"/><stop offset="1" stop-color="#fff" stop-opacity=".2"/></linearGradient>
<filter id="glowS" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<filter id="soft"><feGaussianBlur stdDeviation="2"/></filter>
<filter id="b6" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="6"/></filter>
<filter id="b16" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="16"/></filter>
<filter id="b30" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="30"/></filter>
<filter id="mblur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3 20"/></filter>
</defs>`;
function rbc(x,y,r,rot,f,op=1){return `<g transform="translate(${x},${y}) rotate(${rot}) scale(1,.8)" ${f?`filter="url(#${f})"`:''} opacity="${op}"><circle r="${r}" fill="url(#rbc)"/><ellipse cx="${-r*.1}" cy="${-r*.12}" rx="${r*.4}" ry="${r*.33}" fill="#4a0410" opacity=".55"/><path d="M${-r*.75} ${-r*.35} A${r*.82} ${r*.82} 0 0 1 ${r*.3} ${-r*.76}" stroke="#ffb3bd" stroke-width="${r*.06}" fill="none" opacity=".55" stroke-linecap="round"/></g>`}
function mito(x,y,s,rot,grey,op=1){const w=150,h=60;let d=`M${-w+28} 0`;const n=10,st=(2*w-56)/n;for(let k=0;k<n;k++){const xx=-w+28+k*st,yy=k%2?44:-44;d+=` C${xx+st*.1} ${yy},${xx+st*.4} ${yy},${xx+st*.5} ${yy} S${xx+st*.9} 0,${xx+st} 0`}
 return `<g transform="translate(${x},${y}) rotate(${rot}) scale(${s})" opacity="${op}" ${grey?'':'filter="url(#glowS)"'}>
 ${grey?'':`<ellipse rx="${w+30}" ry="${h+30}" fill="#FF7A59" opacity=".35" filter="url(#b16)"/>`}
 <ellipse rx="${w}" ry="${h}" fill="url(#${grey?'mitoG':'mito'})" stroke="${grey?'#9aa3ad':'#FFE0BD'}" stroke-width="4"/>
 <ellipse rx="${w-14}" ry="${h-13}" fill="${grey?'#2c3038':'url(#mitoIn)'}"/>
 <path d="${d}" fill="none" stroke="${grey?'#8a929c':'#FFE6C9'}" stroke-width="6" stroke-linecap="round"/>
 <ellipse cx="${-w*.3}" cy="${-h*.55}" rx="${w*.45}" ry="${h*.14}" fill="#fff" opacity="${grey?.08:.25}"/></g>`}
function sparksA(cx,cy,n,sp,t,sd,rate=.45,amp=1){let o='';for(let k=0;k<n;k++){const ph=H(k+sd),a=H(k*3.1+sd)*6.283,f=fr(t*rate+ph),d=sp*(.15+f*.95),r=(5+H(k*7+sd)*14)*amp;
 o+=`<circle cx="${cx+Math.cos(a)*d}" cy="${cy+Math.sin(a)*d}" r="${r}" fill="url(#spark)" opacity="${Math.sin(Math.PI*f)}"/>`}return o}
function dust(n,col,t,sd,maxr=4,vy=-12){let o='';for(let k=0;k<n;k++){const x=H(k+sd)*1080+Math.sin(t*.5+k)*10,y=fr(H(k*2+sd)+t*vy/1920)*1920;o+=`<circle cx="${x}" cy="${y}" r="${1+H(k*5+sd)*maxr}" fill="${col}" opacity="${.15+H(k*9+sd)*.5}"/>`}return o}
function cell(cx,cy,R,t,red){
 const col=red?'#ff8b9a':'#9fe6ff',col2=red?'#ff8b9a':'#bff1ff';
 let mem='';for(let k=0;k<150;k++){const a=k/150*6.283+t*.06;mem+=`<circle cx="${cx+Math.cos(a)*R}" cy="${cy+Math.sin(a)*R}" r="5" fill="${col}" opacity=".8"/>`}
 let er='';for(let k=0;k<5;k++){const y=cy+110+k*22,ph=Math.sin(t*1.2+k)*6;er+=`<path d="M${cx-60} ${y+ph} q 30 -18 60 0 t 60 0 t 60 0 t 60 0" stroke="${red?'#c95a72':'#5fc6e6'}" stroke-width="5" fill="none" opacity=".35"/>`}
 let ves='';for(let k=0;k<22;k++){const a=H(k+40)*6.283+t*.05*(k%2?1:-1),d=R*(.2+H(k+90)*.7);ves+=`<circle cx="${cx+Math.cos(a)*d}" cy="${cy+Math.sin(a)*d}" r="${5+H(k+7)*12}" fill="none" stroke="${red?'#ff9aa8':'#8fe9ff'}" stroke-width="3" opacity=".3"/>`}
 const nb=1+Math.sin(t*2)*.015;
 return `<circle cx="${cx}" cy="${cy}" r="${R+60}" fill="${red?'#ff3b4e':'#3fb4ff'}" opacity=".16" filter="url(#b30)"/>
 <circle cx="${cx}" cy="${cy}" r="${R}" fill="url(#${red?'cytoR':'cyto'})"/>
 <circle cx="${cx}" cy="${cy}" r="${R+9}" fill="none" stroke="${col2}" stroke-width="3" opacity=".6"/>
 <circle cx="${cx}" cy="${cy}" r="${R-9}" fill="none" stroke="${col2}" stroke-width="3" opacity=".45"/>${mem}${er}${ves}
 <g transform="translate(${cx+60},${cy+30}) scale(${nb})"><circle r="125" fill="url(#nuc)" opacity="${red?.55:1}" ${red?'':'filter="url(#glowS)"'}/>
 <circle cx="30" cy="-20" r="34" fill="#e6d4ff" opacity=".55"/></g>`}
function callout(x,y,lx,ly,p,col='#D4FF3F'){if(p<=0)return '';const ex2=lx+(lx>x?60:-60);
 return `<g><circle cx="${x}" cy="${y}" r="${10+ (1-p)*30}" fill="none" stroke="${col}" stroke-width="3" opacity="${p}"/><circle cx="${x}" cy="${y}" r="3" fill="${col}"/>
 <polyline points="${x},${y} ${lx},${ly} ${ex2},${ly}" fill="none" stroke="${col}" stroke-width="2.5" pathLength="1" stroke-dasharray="1" stroke-dashoffset="${1-eo(p)}"/></g>`}
function granulo(x,y,r,sd){let g='';for(let k=0;k<45;k++){const a=H(k+sd)*6.283,d=H(k*3+sd)*r*.85;g+=`<circle cx="${Math.cos(a)*d}" cy="${Math.sin(a)*d}" r="${2+H(k*5+sd)*3}" fill="#b874a6" opacity=".75"/>`}
 return `<g transform="translate(${x},${y}) rotate(${H(sd)*360})"><circle r="${r}" fill="#efd3e5" stroke="#cf9ec1" stroke-width="3"/>${g}<g fill="#6b2283" filter="url(#soft)">
 <ellipse cx="${-r*.4}" cy="${-r*.1}" rx="${r*.26}" ry="${r*.2}"/><ellipse cx="${r*.04}" cy="${r*.24}" rx="${r*.25}" ry="${r*.19}"/><ellipse cx="${r*.43}" cy="${-r*.18}" rx="${r*.22}" ry="${r*.18}"/>
 <path d="M${-r*.4} ${-r*.1} Q${-r*.16} ${r*.28} ${r*.04} ${r*.24} Q${r*.3} ${r*.1} ${r*.43} ${-r*.18}" stroke="#6b2283" stroke-width="${r*.09}" fill="none"/></g></g>`}
function gauge(cx,cy,r,p,col,label,val,rot=0){return `<g><circle cx="${cx}" cy="${cy}" r="${r}" fill="rgba(0,0,0,.35)" stroke="rgba(255,255,255,.14)" stroke-width="14"/>
 <circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="${col}" stroke-width="14" stroke-linecap="round" stroke-dasharray="${2*Math.PI*r*clamp(p)} 9999" transform="rotate(-90 ${cx} ${cy})" style="filter:drop-shadow(0 0 16px ${col})"/>
 <g transform="rotate(${rot} ${cx} ${cy})">${Array.from({length:60},(_,k)=>{const a=k/60*6.283;return `<line x1="${cx+Math.cos(a)*(r+20)}" y1="${cy+Math.sin(a)*(r+20)}" x2="${cx+Math.cos(a)*(r+(k%5?28:40))}" y2="${cy+Math.sin(a)*(r+(k%5?28:40))}" stroke="rgba(255,255,255,${k%5?.3:.6})" stroke-width="2"/>`}).join('')}</g>
 ${label?`<text x="${cx}" y="${cy-r*.32}" text-anchor="middle" font-family="JetBrains Mono" font-weight="700" font-size="${r*.14}" fill="rgba(255,255,255,.6)" letter-spacing="3">${label}</text>
 <text x="${cx}" y="${cy+r*.2}" text-anchor="middle" font-family="JetBrains Mono" font-weight="800" font-size="${r*.48}" fill="#fff">${val}</text>`:''}</g>`}

// ===== HUD =====
function hud(i,T,col='#D4FF3F'){
 const rem=Math.max(0,TOT-T),fn=Math.floor(T*30),rs=Math.ceil(rem-.001);
 const ticks=Array.from({length:61},(_,k)=>`<line x1="${70+k*15.67}" y1="${k%5?1818:1808}" x2="${70+k*15.67}" y2="1828" stroke="rgba(255,255,255,${k%5?.25:.5})" stroke-width="2"/>`).join('');
 const r=52,cx=966,cy=232;
 const ring=`<circle cx="${cx}" cy="${cy}" r="${r}" fill="rgba(0,0,0,.4)" stroke="rgba(255,255,255,.18)" stroke-width="3"/>
  <circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="${col}" stroke-width="7" stroke-linecap="round" stroke-dasharray="${2*Math.PI*r*rem/TOT} 9999" transform="rotate(-90 ${cx} ${cy})" style="filter:drop-shadow(0 0 10px ${col})"/>
  ${Array.from({length:24},(_,k)=>{const a=k/24*6.283;return `<line x1="${cx+Math.cos(a)*(r+12)}" y1="${cy+Math.sin(a)*(r+12)}" x2="${cx+Math.cos(a)*(r+(k%6?18:26))}" y2="${cy+Math.sin(a)*(r+(k%6?18:26))}" stroke="rgba(255,255,255,.4)" stroke-width="2"/>`}).join('')}`;
 const cross=(x,y)=>`<g transform="translate(${x},${y})" stroke="rgba(255,255,255,.7)" stroke-width="2.5" fill="none"><circle r="16"/><line x1="-28" y1="0" x2="-8" y2="0"/><line x1="8" y1="0" x2="28" y2="0"/><line x1="0" y1="-28" x2="0" y2="-8"/><line x1="0" y1="8" x2="0" y2="28"/><circle r="3" fill="#fff"/></g>`;
 const corner=(x,y,sx,sy)=>`<path d="M${x} ${y+sy*44} L${x} ${y} L${x+sx*44} ${y}" stroke="rgba(255,255,255,.55)" stroke-width="3" fill="none"/>`;
 const c1x=150+Math.sin(T*.7)*40+H(i)*700,c1y=900+Math.cos(T*.5)*120+H(i+3)*500;
 const blinkRec=Math.floor(T*2)%2===0;
 const prog=T/TOT*940;
 return `<div class="hud"><svg class="L" width="1080" height="1920">
  ${corner(40,40,1,1)}${corner(1040,40,-1,1)}${corner(40,1880,1,-1)}${corner(1040,1880,-1,-1)}
  <line x1="70" y1="1818" x2="1010" y2="1818" stroke="rgba(255,255,255,.22)" stroke-width="2"/>${ticks}
  <rect x="70" y="1790" width="${prog}" height="5" fill="${col}"/><rect x="${70+prog-2}" y="1780" width="4" height="54" fill="#fff"/>
  ${ring}${cross(clamp(c1x,90,990),clamp(c1y,700,1600))}

 ${gauge(540,1020,310,v/100,col,'','',t*10)}
 ${mito(540,1020+Math.sin(t*1.5)*10,1.1,-18+Math.sin(t)*4,v<40,1)}${sparksA(540,1020,Math.round(6+v/100*26),300,t,12,.6,lerp(.6,1.3,v/100))}
 <text x="540" y="1420" text-anchor="middle" font-family="JetBrains Mono" font-weight="800" font-size="58" fill="#fff">ЭНЕРГИЯ ${Math.round(v)}%</text></svg>
 <div class="T" style="top:340px">${W('Персональный',76,P(t,.1,.6))}</div>
 <div class="T" style="top:450px">${BLK('план',120,P(t,.45,.95))}</div>`};

S[9]=(t)=>{const lp=eo(P(t,.1,.9));
 return `<div class="over" style="background:radial-gradient(80% 50% at 50% 42%,#15180f 0%,#07080a 60%,#020203 100%)"></div>
 <svg class="L" width="1080" height="1920">${DEFS}${dust(70,'#fff',t,10,2)}
 <circle cx="540" cy="560" r="230" fill="#FF7A59" opacity=".18" filter="url(#b30)"/>
 <circle cx="540" cy="560" r="190" fill="none" stroke="rgba(212,255,63,.6)" stroke-width="3" pathLength="1" stroke-dasharray="${eo(P(t,0,.8))} 1" transform="rotate(-90 540 560)"/>
 <circle cx="540" cy="560" r="214" fill="none" stroke="rgba(255,255,255,.2)" stroke-width="2" stroke-dasharray="3 12" transform="rotate(${t*10} 540 560)"/>
 ${mito(540,560+Math.sin(t*1.4)*8,.95*eb(P(t,0,.6)),-18+Math.sin(t)*4)}${sparksA(540,560,14,200,t,13)}</svg>
 <img src="logo.png" style="position:absolute;z-index:6;left:110px;top:860px;width:860px;opacity:${lp};filter:blur(${(1-lp)*16}px);transform:scale(${1.12-.12*lp})">
 <div class="T" style="top:1120px">${W('начинаем',78,P(t,.6,1.1))}</div>

 <div class="T" style="top:1385px">${BLK('записаться →',56,P(t,1.4,1.8))}</div>
 <div class="T" style="top:1525px"><span class="m" style="font-size:28px;opacity:.85">${TY('@lovemybody.clinic',P(t,1.7,2.3))}</span></div>
 <div style="position:absolute;left:90px;right:90px;top:1600px;z-index:6;text-align:center;font-size:19px;line-height:1.4;color:rgba(255,255,255,.45);opacity:${P(t,1.9,2.4)}">Исследование не является самостоятельным методом диагностики. Результаты оценивает врач. Имеются противопоказания, необходима консультация специалиста.</div>`};

// ===== сцена 0: приветствие =====
const INTRO=(t,d)=>{const C=TL.subs.filter(x=>x.scene===0).map(x=>x.s-SC[0][0]);
 const lp=eo(P(t,C[1]+.25,C[1]+1.1)),sx=P(t,C[1]+.2,C[1]+1.0);
 let bg='';[[150,420,140,20,'b30',.35],[960,700,110,-30,'b16',.3],[880,1500,170,40,'b30',.35],[120,1350,90,10,'b16',.3]].forEach((c,k)=>bg+=rbc(c[0]+Math.sin(t*.5+k)*25,c[1]-t*(10+k*4),c[2],c[3]+t*4,c[4],c[5]));
 const rings=[460,380,300].map((r,k)=>`<circle cx="540" cy="900" r="${r}" fill="none" stroke="rgba(212,255,63,${.07+k*.05})" stroke-width="2" stroke-dasharray="${k==1?'4 14':'80 24'}" stroke-dashoffset="${t*(k%2?25:-35)}"/>`).join('');
 return `<svg class="L" width="1080" height="1920">${DEFS}${bg}${dust(90,'#fff',t,21,2.5)}${rings}

 <div class="T" style="top:330px"><span class="m" style="font-size:28px;color:var(--lime)">${TY('● в эфире',P(t,0,.5))}</span></div>

 <img src="logo.png" style="position:absolute;z-index:6;left:110px;top:760px;width:860px;opacity:${lp};filter:blur(${(1-lp)*16}px);transform:scale(${1.1-.1*lp})">
 ${sx>0&&sx<1?`<div style="position:absolute;z-index:7;top:740px;height:260px;left:${110+sx*860}px;width:6px;background:#D4FF3F;box-shadow:0 0 30px #D4FF3F,0 0 60px #D4FF3F"></div>`:''}
 <div class="T" style="top:1150px"><span class="sm" style="font-size:40px;opacity:${P(t,C[2]-.1,C[2]+.2)}">${TY('сегодня расскажем',P(t,C[2]-.1,C[2]+.6))}</span></div>
 <div class="T" style="top:1240px">${BLK('что такое мито-паспорт',56,P(t,C[3]-.1,C[3]+.35))}</div>
 <div class="T" style="top:1400px">${BR('и для чего он нужен',54,P(t,C[4]-.1,C[4]+.5))}</div>`};

// ===== зерно =====
const GR=[];(function(){for(let g=0;g<4;g++){const c=document.createElement('canvas');c.width=540;c.height=960;const x=c.getContext('2d');const im=x.createImageData(540,960);
 for(let k=0;k<im.data.length;k+=4){const v=Math.random()*255;im.data[k]=im.data[k+1]=im.data[k+2]=v;im.data[k+3]=255}x.putImageData(im,0,0);GR.push(c.toDataURL())}})();

function SUBS(T,i){if(i===0||i===10)return '';const s=TL.subs.find(x=>x.scene===i&&T>=x.s-.05&&T<x.e+.2);if(!s)return '';
 const L=s.text.length,p=(T-s.s)/Math.max(.1,s.e-s.s);let acc=0;
 const html=s.text.split(' ').map(w=>{const st=acc/L;acc+=w.length+1;const en=acc/L;const on=p>=st-.02,cur=on&&p<en;
  return `<span style="color:${cur?'#D4FF3F':'#fff'};opacity:${on?1:.42}">${w}</span>`}).join(' ');
 const e=eo(P(T,s.s-.05,s.s+.12));
 return `<div class="sub" style="opacity:${e};transform:translateY(${(1-e)*18}px)"><span>${html}</span></div>`}

// ===== рендер =====
const stage=document.getElementById('stage');
window.render=function(T){
 let i=SC.findIndex(s=>T>=s[0]&&T<s[1]);if(i<0)i=SC.length-1;
 const [a,b]=SC[i],t=T-a,d=b-a;
 // камера
 let sc=1+.045*(t/d),bl=0,sx=0,sy=0,rot=0;
 if(i===1){const z=P(t,d-.65,d);sc+=z*z*1.6;bl+=z*z*14}
 if(i===2){const z=P(t,d-.55,d);sc+=z*z*1.4;bl+=z*z*12}
 if(i===4){sx+=Math.sin(T*47)*3;sy+=Math.cos(T*53)*3}
 SHAKES.forEach(([st,am])=>{const k=T-st;if(k>=0&&k<.5){const e=Math.pow(1-k/.5,2)*am;sx+=Math.sin(k*90)*28*e;sy+=Math.cos(k*77)*22*e;rot+=Math.sin(k*60)*1.2*e}});
 // переходы
 let fl=0,gl=0;SC.forEach((s,k)=>{if(k===0)return;const dt=T-s[0];if(dt>-.12&&dt<.4){const f=dt<0?(dt+.12)/.12:1-dt/.4;fl=Math.max(fl,f);gl=Math.max(gl,f)}});
 bl+=fl*9;sc+=fl*.06;
 const col=i===4?'#FF3B4E':'#D4FF3F';
 let bars='';if(gl>.05){for(let k=0;k<7;k++){const y=H(k+Math.floor(T*30))*1920,h=6+H(k*3+Math.floor(T*30))*60;bars+=`<div style="position:absolute;left:0;right:0;top:${y}px;height:${h}px;background:${k%3?col:'#fff'};opacity:${gl*.55};mix-blend-mode:screen;transform:translateX(${(H(k*7+T)-.5)*200}px)"></div>`}}
 const fade=i===9?0:0;
 stage.innerHTML=`<div class="cam" style="transform:translate(${sx}px,${sy}px) scale(${sc}) rotate(${rot}deg);filter:${bl>.05?`blur(${bl.toFixed(2)}px)`:'none'} ${fl>0?`brightness(${1+fl*.8})`:''}">
  <div class="F">${S[i](t,d)}</div></div>
  ${hud(i,T,col)}
  ${SUBS(T,i)}
  <div class="over" style="background:radial-gradient(120% 75% at 50% 50%,transparent 55%,rgba(0,0,0,.7) 100%);z-index:40"></div>
  <div class="over" style="z-index:41;background:repeating-linear-gradient(0deg,rgba(255,255,255,.025) 0 2px,transparent 2px 5px)"></div>
  <img class="over" src="${GR[Math.floor(T*30)%4]}" style="width:1080px;height:1920px;z-index:42;opacity:.09;mix-blend-mode:overlay">
  <div class="over" style="z-index:43">${bars}</div>
  <div class="over" style="z-index:44;background:#fff;opacity:${fl*.55}"></div>
  <div class="over" style="z-index:45;background:#000;opacity:${Math.max(clamp(1-T/.35),P(T,TOT-.45,TOT))}"></div>`;
};
window.render(+(new URLSearchParams(location.search).get('t')||2));
</script></body></html>
